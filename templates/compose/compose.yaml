# Compose project of ONE SISF factory deployment in Docker mode.
#
# `sisf up --mode docker` renders this template into the install directory,
# with the digests of the images it just built, and runs it. Do not edit the
# rendered file: the next `sisf up` replaces it, and `sisf doctor` rejects a
# file that breaks the isolation rules checked in internal/install.
#
# One project, one service per long-running unit. Every container, network
# and volume is named "{{ .Project }}-..." so it can be told apart from
# anything else on the host; the containers the supervisor deploys are named
# "{{ .FactoryID }}-<unit>-<digest>", which starts with the same prefix.
#
# Isolation, in short:
#   - five networks: app, factory, control, sandbox and docker. The sandbox
#     and docker networks are internal. Only the edge is on the sandbox (the
#     egress proxy, the runners' only way out); only the supervisor and the
#     two Docker request filters are on the docker network.
#   - each zone reads only its own secrets (an env file of its own area);
#     nothing mounts the secrets directory.
#   - only the two Docker request filters mount the host's Docker socket.
#     Each serves one client, the supervisor, and refuses every request its
#     role does not need: the runner filter creates the sandboxes candidate
#     builds run in, the deploy filter the revisions of the units. No other
#     service reaches a Docker API, and the agent zone reaches none.
#   - the supervisor alone holds deploy and signing power: the trust volume
#     with its delegated keys, the edge's admin token and the filters. Its
#     admin socket, which carries out an emergency stop and an Owner
#     rollback, is a Unix socket on a volume only it and control mount.
#   - control reads the edge's counters with a read-only token of its own;
#     it never holds the edge's admin token.
#   - the state database is on the factory network only, which the edge is
#     not on.
#   - every published port is bound to 127.0.0.1, in the 7460-7469 range.
#
# Runtime contract with factoryd: it reads its manifest from SISF_CONFIG,
# listens on SISF_LISTEN, opens the state store with SISF_STATE_DSN, signs
# people in as SISF_EXTERNAL_URL, SISF_OWNER_IDENTITIES and SISF_AUTH_*
# say, and takes SISF_WEBHOOK_SECRET, SISF_GITHUB_TOKEN, SISF_APPROVAL_KEY,
# EDGE_COUNTERS_TOKEN and the sign-in client secrets from its environment.
# Secrets arrive only through the env file of the zone.
name: "{{ .Project }}"

x-hardened: &hardened
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp"]

services:
  # ---- shared: state -------------------------------------------------------
  state:
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    container_name: "{{ .Project }}-state"
    image: "{{ .PostgresImage }}"
    env_file: ["{{ .SecretsDir }}/state/runtime.env"]
    environment:
      POSTGRES_USER: sisf_owner
      POSTGRES_DB: sisf
    networks: [factory]
{{- if .Debug }}
    ports: ["127.0.0.1:{{ .PortPostgres }}:5432"]
{{- end }}
    volumes: ["state-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisf_owner -d sisf"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot install step: migrates the schema, creates one role per zone and
  # grants each role what its zone may reach. Run by `sisf up`, never started
  # with the project.
  state-bootstrap:
    <<: *hardened
    restart: "no"
    profiles: ["bootstrap"]
    container_name: "{{ .Project }}-state-bootstrap"
    image: "{{ .Images.Sisf }}"
    command: {{ .BootstrapCommand }}
    env_file: ["{{ .SecretsDir }}/state/bootstrap.env"]
    networks: [factory]
    depends_on:
      state: {condition: service_healthy}

  # ---- Zone 3: control plane -----------------------------------------------
  # One-shot install step: places the delegated keys `sisf up` issued with
  # the root key, and the record of the release it signed, on the trust
  # volume. No network; its env file is emptied as soon as it has run.
  trust-bootstrap:
    <<: *hardened
    restart: "no"
    profiles: ["bootstrap"]
    container_name: "{{ .Project }}-trust-bootstrap"
    image: "{{ .Images.Sisf }}"
    command: ["sisf", "trust", "install", "--trust-dir=/var/lib/sisf/trust"]
    env_file: ["{{ .SecretsDir }}/control/trust.env"]
    network_mode: "none"
    volumes: ["trust:/var/lib/sisf/trust"]

  supervisor:
    <<: *hardened
    container_name: "{{ .Project }}-supervisor"
    image: "{{ .Images.Supervisor }}"
    command:
      - supervisor
      - run
      - --factory-id={{ .FactoryID }}
      - --manifest=/etc/sisf/release/release-manifest.json
      - --root-key-ref=env:SISF_ROOT_PUBLIC_KEY
      - --trust-dir=/var/lib/sisf/trust
      - --admin=unix:{{ .SupervisorAdmin }}
      - --dispatcher-admin-url=http://dispatcher:{{ .PortDispatcherAdmin }}
{{- if .Lifecycle.Enabled }}
      - --factory-manifest=/etc/sisf/factory.yaml
      - --coder-agent={{ .Lifecycle.CoderAgent }}
      - --lifecycle-interval={{ .Lifecycle.Interval }}
      - --exec=docker
      - --exec-docker-endpoint=http://docker-filter-runner:{{ .PortDockerFilter }}
      - --exec-docker-network={{ .Project }}-sandbox
      - --egress-proxy=http://egress:{{ .PortEgress }}
      - --runner-image={{ .Images.Runner }}
      - --deploy=compose
      - --edge-admin-url=http://edge-admin:{{ .PortEdgeAdmin }}
      - --deploy-docker-endpoint=http://docker-filter-deploy:{{ .PortDockerFilter }}
      - --deploy-network={{ .Project }}-app
      - --deploy-app-port={{ .PortApp }}
      - --qa-judge={{ .Lifecycle.QAJudge }}
{{- if .Lifecycle.QAAgent }}
      - --qa-agent={{ .Lifecycle.QAAgent }}
{{- end }}
{{- if .Lifecycle.QAAgentBinary }}
      - --qa-agent-binary={{ .Lifecycle.QAAgentBinary }}
{{- end }}
{{- if .Lifecycle.BuildCommand }}
      - "--build-command={{ .Lifecycle.BuildCommand }}"
{{- end }}
{{- if .Lifecycle.ReleaseWindow }}
      - --release-window={{ .Lifecycle.ReleaseWindow }}
      - --release-min-samples={{ .Lifecycle.ReleaseMinSamples }}
{{- end }}
{{- end }}
    env_file: ["{{ .SecretsDir }}/control/supervisor.env"]
    environment:
      SISF_GITHUB_API_URL: "{{ .GitHubAPIURL }}"
    # control: GitHub, the edge's admin listener; factory: the state store
    # as the control role, the dispatcher's run control; app: the health of
    # the revisions it deploys; docker: the two filters. It serves nothing
    # on any of them: its status socket is on loopback.
    networks: [control, factory, app, docker]
    volumes:
      - "trust:/var/lib/sisf/trust"
      - "supervisor-admin:{{ .SupervisorAdminDir }}"
      - "{{ .ReleaseFile }}:/etc/sisf/release/release-manifest.json:ro"
      - "{{ .ConfigFile }}:/etc/sisf/factory.yaml:ro"
    healthcheck:
      test: ["CMD", "supervisor", "status", "--admin=unix:{{ .SupervisorAdmin }}"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      state: {condition: service_healthy}
      edge: {condition: service_started}
      docker-filter-runner: {condition: service_started}
      docker-filter-deploy: {condition: service_started}

  # The Docker request filters: the supervisor's only Docker access, one per
  # backend, each reachable on the docker network alone.
  docker-filter-runner:
    <<: *hardened
    container_name: "{{ .Project }}-docker-filter-runner"
    image: "{{ .Images.Sisf }}"
    command:
      - sisf
      - docker-filter
      - --role=runner
      - --listen=0.0.0.0:{{ .PortDockerFilter }}
      - --factory-id={{ .FactoryID }}
      - --network={{ .Project }}-sandbox
      - --image={{ .Images.Runner }}
      - --image={{ .Images.QARunner }}
    group_add: ["{{ .Host.SocketGID }}"]
    networks: [docker]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]

  docker-filter-deploy:
    <<: *hardened
    container_name: "{{ .Project }}-docker-filter-deploy"
    image: "{{ .Images.Sisf }}"
    command:
      - sisf
      - docker-filter
      - --role=deploy
      - --listen=0.0.0.0:{{ .PortDockerFilter }}
      - --factory-id={{ .FactoryID }}
      - --network={{ .Project }}-app
      - --image={{ .Images.App }}
{{- if .Sim }}
      - --sim-image=app={{ .Images.App }}
{{- end }}
    group_add: ["{{ .Host.SocketGID }}"]
    networks: [docker]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]

  control:
    <<: *hardened
    container_name: "{{ .Project }}-control"
    image: "{{ .Images.Factoryd }}"
    command: ["factoryd", "control"]
    env_file: ["{{ .SecretsDir }}/control/runtime.env"]
    environment:
      SISF_FACTORY_ID: "{{ .FactoryID }}"
      SISF_CONFIG: /etc/sisf/factory.yaml
      SISF_LISTEN: "0.0.0.0:{{ .PortControl }}"
      SISF_LISTEN_ALLOW_NON_LOOPBACK: "true"
      SISF_GITHUB_API_URL: "{{ .GitHubAPIURL }}"
{{- if .ReconcileInterval }}
      SISF_GITHUB_RECONCILE_INTERVAL: "{{ .ReconcileInterval }}"
{{- end }}
      # /healthz of Zone 1 through the edge, and of Zone 2, for the zone report.
      SISF_APP_HEALTH_URL: "http://edge:{{ .PortEdge }}/healthz"
      SISF_DISPATCHER_HEALTH_URL: "http://dispatcher:{{ .PortDispatcher }}/healthz"
      # Sign-in: the origin people reach control at, the Owner and the
      # providers; the client secrets are in the env file.
      SISF_EXTERNAL_URL: "{{ .Identity.ExternalURL }}"
      SISF_OWNER_IDENTITIES: "{{ .Owners }}"
{{- if .Identity.OIDCIssuer }}
      SISF_AUTH_OIDC_ISSUER: "{{ .Identity.OIDCIssuer }}"
      SISF_AUTH_OIDC_CLIENT_ID: "{{ .Identity.OIDCClientID }}"
{{- end }}
{{- if .Identity.GitHubClientID }}
      SISF_AUTH_GITHUB_CLIENT_ID: "{{ .Identity.GitHubClientID }}"
{{- end }}
{{- if .Identity.GitHubURL }}
      SISF_AUTH_GITHUB_URL: "{{ .Identity.GitHubURL }}"
{{- end }}
{{- if .Identity.GitHubAPIURL }}
      SISF_AUTH_GITHUB_API_URL: "{{ .Identity.GitHubAPIURL }}"
{{- end }}
      # The supervisor's admin socket, for an emergency stop and an Owner
      # rollback, and the edge's counters, which control reads with its
      # read-only token.
      SISF_SUPERVISOR_ADMIN_ADDR: "unix:{{ .SupervisorAdmin }}"
      SISF_EDGE_COUNTERS_URL: "http://edge-admin:{{ .PortEdgeAdmin }}"
      # The control zone's encrypted secret store, in its own volume; the
      # env provider serves the SISF_CONTROL_SECRET_ variables of its env file.
      SISF_LOCAL_STORE_DIR: /var/lib/sisf/control/secrets
{{- if .Host.TrustedProxies }}
      # The control network: the edge forwards a reporter's address from it.
      SISF_TRUSTED_PROXIES: "{{ .Host.TrustedProxies }}"
{{- end }}
    networks: [control, factory]
    ports:
      - "127.0.0.1:{{ .PortControl }}:{{ .PortControl }}"
{{- if .Sim }}
      - "127.0.0.1:{{ .PortFakeGitHub }}:{{ .PortFakeGitHub }}"
      - "127.0.0.1:{{ .PortFakeOIDC }}:{{ .PortFakeOIDC }}"
{{- end }}
    volumes:
      - "control-data:/var/lib/sisf/control"
      - "supervisor-admin:{{ .SupervisorAdminDir }}"
      - "{{ .ConfigFile }}:/etc/sisf/factory.yaml:ro"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:{{ .PortControl }}/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      state: {condition: service_healthy}

  # ---- Zone 2: agent factory -----------------------------------------------
  dispatcher:
    <<: *hardened
    container_name: "{{ .Project }}-dispatcher"
    image: "{{ .Images.Factoryd }}"
    command:
      - factoryd
      - dispatcher
      - --admin-listen=0.0.0.0:{{ .PortDispatcherAdmin }}
{{- if .Sim }}
      - --agent=fake
      - --fake-agent-work={{ .Lifecycle.AgentWork }}
      - --fake-agent-patch=/etc/sisf/agent/patch.diff
{{- end }}
{{- if .Lifecycle.RunEstimateMicros }}
      - --run-estimate-micros={{ .Lifecycle.RunEstimateMicros }}
{{- end }}
    env_file: ["{{ .SecretsDir }}/agent/runtime.env"]
    environment:
      SISF_FACTORY_ID: "{{ .FactoryID }}"
      SISF_CONFIG: /etc/sisf/factory.yaml
      SISF_LISTEN: "0.0.0.0:{{ .PortDispatcher }}"
      SISF_LISTEN_ALLOW_NON_LOOPBACK: "true"
    networks: [factory]
    volumes:
      - "{{ .ConfigFile }}:/etc/sisf/factory.yaml:ro"
{{- if .Sim }}
      - "{{ .SimAgentDir }}:/etc/sisf/agent:ro"
{{- end }}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:{{ .PortDispatcher }}/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      state: {condition: service_healthy}

  # ---- Zone 1: application -------------------------------------------------
  # The release `sisf up` installs, named and labelled as the supervisor's
  # deployment backend names the revisions it runs, so the backend observes
  # it as the last known good release and replaces it by a canary.
  app:
    <<: *hardened
    container_name: "{{ .AppContainer }}"
    image: "{{ .Images.App }}"
    labels:
      sisf.factory: "{{ .FactoryID }}"
      sisf.unit: app
      sisf.digest: "{{ .AppDigest }}"
    env_file: ["{{ .SecretsDir }}/application/runtime.env"]
    environment:
      HELLO_ADDR: "0.0.0.0:{{ .PortApp }}"
      HELLO_DATA_DIR: /data
      SISF_REVISION: "{{ .AppDigest }}"
    networks: [app]
    volumes: ["app-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:{{ .PortApp }}/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- shared: edge --------------------------------------------------------
  edge:
    <<: *hardened
    container_name: "{{ .Project }}-edge"
    image: "{{ .Images.Edge }}"
    command:
      - edge
      - --listen=0.0.0.0:{{ .PortEdge }}
      - --allow-non-loopback
      - --upstream=http://{{ .AppContainer }}:{{ .PortApp }}
      - --revision={{ .AppDigest }}
      - --route=/webhooks/github=http://control:{{ .PortControl }}
      - --route=/report=http://control:{{ .PortControl }}
      # Each listener is bound to the address of one network only: the
      # admin listener to the control network, the egress proxy to the
      # sandbox.
      - --admin-listen=edge-admin:{{ .PortEdgeAdmin }}
      - --egress-listen=egress:{{ .PortEgress }}
    env_file: ["{{ .SecretsDir }}/edge/runtime.env"]
    networks:
      app: {}
      control: {aliases: [edge-admin]}
      sandbox: {aliases: [egress]}
    ports: ["127.0.0.1:{{ .PortEdge }}:{{ .PortEdge }}"]
    depends_on:
      app: {condition: service_healthy}

  # ---- simulation profile: the fake GitHub ---------------------------------
  # Runs in the network namespace of control, so the factory reaches it at
  # 127.0.0.1 (the GitHub client sends a token over plain http only to a
  # loopback address). It listens on every interface of that namespace so that
  # the port published by control reaches it; the host side stays on 127.0.0.1.
{{- if .Sim }}
  sim-github:
    <<: *hardened
    profiles: ["sim"]
    container_name: "{{ .Project }}-sim-github"
    image: "{{ .Images.Sisf }}"
    network_mode: "service:control"
    command:
      - sisf
      - sim
      - github
      - --addr=0.0.0.0:{{ .PortFakeGitHub }}
      - --allow-non-loopback
      - --repo={{ .Repository }}
      - --webhook-url=http://127.0.0.1:{{ .PortControl }}/webhooks/github
    env_file: ["{{ .SecretsDir }}/sim/runtime.env"]
    depends_on:
      control: {condition: service_started}

  # The fake identity provider people and control sign in at, in the
  # network namespace of control for the same reason: control reaches it at
  # its issuer, 127.0.0.1:{{ .PortFakeOIDC }}, and so does a browser on the
  # host through the port control publishes on 127.0.0.1. Its client is
  # public; it holds no secret.
  sim-oidc:
    <<: *hardened
    profiles: ["sim"]
    container_name: "{{ .Project }}-sim-oidc"
    image: "{{ .Images.Sisf }}"
    network_mode: "service:control"
    command:
      - sisf
      - sim
      - oidc
      - --addr=0.0.0.0:{{ .PortFakeOIDC }}
      - --allow-non-loopback
      - --issuer={{ .Identity.OIDCIssuer }}
    depends_on:
      control: {condition: service_started}

  # The supervisor's way to the fake GitHub: a plain relay in its network
  # namespace, on its loopback, to the fake in control's namespace. The
  # GitHub client sends a token over plain http to a loopback address only.
  sim-github-relay:
    <<: *hardened
    profiles: ["sim"]
    container_name: "{{ .Project }}-sim-github-relay"
    image: "{{ .Images.Edge }}"
    network_mode: "service:supervisor"
    command:
      - edge
      - --listen=127.0.0.1:{{ .PortFakeGitHub }}
      - --upstream=http://control:{{ .PortFakeGitHub }}
      - --egress-listen=
    depends_on:
      supervisor: {condition: service_started}
      sim-github: {condition: service_started}
{{- end }}

networks:
  app:
    name: "{{ .Project }}-app"
  factory:
    name: "{{ .Project }}-factory"
    internal: true
  control:
    name: "{{ .Project }}-control"
  sandbox:
    name: "{{ .Project }}-sandbox"
    internal: true
  docker:
    name: "{{ .Project }}-docker"
    internal: true

volumes:
  state-data:
    name: "{{ .Project }}-state-data"
  app-data:
    name: "{{ .Project }}-app-data"
  control-data:
    name: "{{ .Project }}-control-data"
  supervisor-admin:
    name: "{{ .Project }}-supervisor-admin"
  trust:
    name: "{{ .Project }}-trust"
  workspaces:
    name: "{{ .Project }}-workspaces"
  qa-workspaces:
    name: "{{ .Project }}-qa-workspaces"
  artifacts:
    name: "{{ .Project }}-artifacts"
