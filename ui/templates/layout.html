{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{template "title" .}} - SISF control</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="bar">
  <span class="brand">SISF control</span>
  {{if .LoggedIn}}
  <nav>
    <a href="/"{{if eq .Nav "overview"}} aria-current="page"{{end}}>Overview</a>
    <a href="/workboard"{{if eq .Nav "workboard"}} aria-current="page"{{end}}>Workboard</a>
  </nav>
  <form method="post" action="/logout" class="logout"><button type="submit">Log out</button></form>
  {{end}}
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>
{{end}}
