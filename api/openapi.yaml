# Generated by go generate ./internal/actions/... from the action registry. Do not edit.
components:
  responses:
    Error:
      content:
        application/json:
          schema:
            properties:
              error:
                $ref: '#/components/schemas/Error'
            required:
              - error
            type: object
      description: A typed error with the next valid steps.
  schemas:
    Change:
      properties:
        after: {}
        before: {}
        op:
          enum:
            - create
            - update
            - delete
          type: string
        resource:
          type: string
      required:
        - resource
        - op
      type: object
    DryRun:
      properties:
        changes:
          items:
            $ref: '#/components/schemas/Change'
          type: array
        requires_approval:
          type: boolean
        warnings:
          items:
            type: string
          type: array
      required:
        - changes
        - requires_approval
      type: object
    Error:
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        details:
          additionalProperties:
            type: string
          type: object
        message:
          type: string
        next_actions:
          items:
            $ref: '#/components/schemas/NextAction'
          type: array
      required:
        - code
        - message
      type: object
    ErrorCode:
      enum:
        - INVALID_ARGUMENT
        - NOT_FOUND
        - ALREADY_EXISTS
        - UNAUTHENTICATED
        - PERMISSION_DENIED
        - APPROVAL_REQUIRED
        - STEP_UP_REQUIRED
        - CONFLICT
        - INVALID_TRANSITION
        - GUARD_FAILED
        - LEASE_HELD
        - STALE_FENCING_TOKEN
        - REPLAYED
        - EXPIRED
        - SIGNATURE_INVALID
        - TAMPERED
        - POLICY_HOLD
        - BUDGET_UNCONFIRMED
        - BUDGET_EXCEEDED
        - LIMIT_EXCEEDED
        - RATE_LIMITED
        - NOT_SUPPORTED
        - RELEASE_HOLD
        - FROZEN
        - UNAVAILABLE
        - TIMEOUT
        - INTERNAL
      type: string
    NextAction:
      properties:
        action:
          type: string
        description:
          type: string
        params:
          additionalProperties:
            type: string
          type: object
      required:
        - action
      type: object
  securitySchemes:
    bearerAuth:
      description: A session, personal access token or service token; its scopes must cover the action's.
      scheme: bearer
      type: http
info:
  description: Every surface of the factory calls this one action service. An action's description documents it and never grants permission. Sensitive writes go plan, approval, execute, audit.
  title: SISF action API
  version: v1
openapi: 3.1.0
paths:
  /api/v1/actions/approvals.decide:
    post:
      operationId: approvals_decide
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                approval_id:
                  description: The approved request this call spends. Without it, the call files a request and answers APPROVAL_REQUIRED.
                  type: string
                dry_run:
                  description: Report exactly what would change and change nothing.
                  type: boolean
                idempotency_key:
                  description: A retry with the same key and input within 24 hours gets the first answer without the write running again; the same key with another input is CONFLICT.
                  maxLength: 256
                  type: string
                input:
                  additionalProperties: false
                  description: nonce, subject_digest and policy_revision echo what the approver was shown.
                  properties:
                    conditions:
                      additionalProperties: false
                      properties:
                        budget_cap:
                          description: Spending cap in micros.
                          minimum: 0
                          type: integer
                        expires_at:
                          format: date-time
                          type: string
                      type: object
                    decision:
                      enum:
                        - approve
                        - reject
                        - request_changes
                      type: string
                    nonce:
                      type: string
                    policy_revision:
                      type: string
                    reason:
                      type: string
                    request_id:
                      type: string
                    subject_digest:
                      type: string
                  required:
                    - request_id
                    - nonce
                    - subject_digest
                    - policy_revision
                    - decision
                  type: object
              type: object
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  audit_id:
                    type: string
                  output:
                    properties:
                      request:
                        type: object
                    type: object
                  plan:
                    $ref: '#/components/schemas/DryRun'
                type: object
          description: The action ran.
        default:
          $ref: '#/components/responses/Error'
      security:
        - bearerAuth:
            - approvals:write
      summary: Approve, reject or request changes on an approval request; Owner only, with step-up.
      tags:
        - approvals
      x-sisf-action: approvals.decide
      x-sisf-dry-run: true
      x-sisf-roles:
        - owner
      x-sisf-sensitivity: sensitive
      x-sisf-step-up: true
