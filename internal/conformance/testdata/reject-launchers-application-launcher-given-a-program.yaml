# Rejected: the application unit starts the application launcher with a program named in the manifest; only the supervisor names that program, at deploy time.
# expect: unit.command_through_launcher
#
# Digests are placeholders. The reject-*.yaml files beside this one are this
# manifest, or its sibling for the other mode, with exactly one defect each.
api_version: sisf/v1
factory_id: acme-hello
deployment_id: laptop
mode: standalone
repository: {owner: acme, repo: hello-app}
components:
  application: {source: apps/web, credentials_ref: local:zone1-application, store_role: sisf_application}
  agent: {source: factory, credentials_ref: local:zone2-agent, store_role: sisf_agent}
  control: {source: control, credentials_ref: local:zone3-control, store_role: sisf_control}
units:
  app:
    command: [bin/sisf-app-launcher, x, /tmp/evil]
    digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
    lifecycle: long_running
    networks: [app]
    port: 7461
    mounts: [{volume: app-data, path: data/app}]
  control:
    command: [bin/factoryd, control]
    digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
    lifecycle: long_running
    networks: [control, factory]
    port: 7463
    mounts: [{volume: control-data, path: data/control}]
  supervisor:
    image: bin/sisf-supervisor
    command: [bin/sisf-supervisor]
    digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
    lifecycle: long_running
    networks: [control]
    port: 7464
    mounts: [{volume: trust, path: data/trust}]
  dispatcher:
    command: [bin/factoryd, dispatcher]
    digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
    lifecycle: long_running
    networks: [factory]
    port: 7465
  runner:
    command: [bin/sisf-runner]
    digest: sha256:4444444444444444444444444444444444444444444444444444444444444444
    lifecycle: ephemeral
    networks: [sandbox]
    mounts: [{volume: workspaces, path: data/workspaces}]
  qa-runner:
    command: [bin/sisf-qa-runner]
    digest: sha256:5555555555555555555555555555555555555555555555555555555555555555
    lifecycle: ephemeral
    networks: [sandbox]
    credentials_ref: local:zone2-qa
    mounts: [{volume: qa-workspaces, path: data/qa-workspaces}]
  state:
    lifecycle: durable
    mounts: [{volume: state-data, path: data/state}]
  artifacts:
    lifecycle: durable
    mounts: [{volume: artifacts, path: data/artifacts}]
  edge:
    command: [bin/sisf-edge]
    digest: sha256:7777777777777777777777777777777777777777777777777777777777777777
    lifecycle: long_running
    networks: [app, control, sandbox]
    port: 7460
    public: true
supervisor:
  image: bin/sisf-supervisor
  digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
  trust_volume: trust
  root_key_ref: env:SISF_ROOT_PUBLIC_KEY
  digest_change: governance
  startup_self_check: true
networks:
  app: {}
  factory: {}
  control: {}
  sandbox: {internal: true, egress_via: edge}
volumes:
  app-data: {zone: application}
  workspaces: {zone: agent}
  qa-workspaces: {zone: agent}
  control-data: {zone: control}
  trust: {zone: control}
  state-data: {zone: shared}
  artifacts: {zone: shared, holder: artifacts}
storage:
  state: {driver: sqlite, path: data/state/factory.db}
  artifacts: {kind: volume, location: artifacts}
adapters:
  coder: {name: claude}
  qa: {name: codex}
  execution: {name: local}
  deploy: {name: local}
release:
  policy: B
  strategy: blue_green
  units: [app]
  rollback: {error_rate: 0.02, baseline_delta: 0.01, min_samples: 100, window: 10m, consecutive_windows: 2}
  low_traffic: {min_hold: 30m, synthetic_suite: synthetic}
budget: {mode: unlimited, alert_threshold_micros: 50000000}
limits: {run_timeout: 30m, max_attempts: 3, concurrency: 2, clarify_timeout: 72h}
egress: {mode: allowlist, allow: [api.github.com, github.com]}
# Local processes are neither isolated nor held to the egress allowlist above,
# so the Owner states that only trusted code runs here.
trusted_code_only: true
model_routes:
  routes:
    coding: {provider: anthropic, model: mid, effort: low}
    qa: {provider: openai, model: mid, effort: low}
