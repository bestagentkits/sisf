# yaml-language-server: $schema=../schemas/factory.schema.json
#
# Example manifest of one factory deployment in Docker mode: one factory_id,
# three zones, nine runtime units and the trusted release supervisor, all in
# one compose project. The Standalone variant of the same deployment is
# internal/conformance/testdata/valid-standalone.yaml.
#
# Check it with:  sisf conformance check .sisf/factory.yaml
#
# This file holds desired state approved by the Owner. It contains references
# to secrets, never the secrets themselves. The digests are placeholders; a
# real install pins the digests of its signed release manifest.
api_version: sisf/v1
factory_id: acme-hello
deployment_id: local
mode: docker

repository:
  owner: acme
  repo: hello-app

# The three zones. Each has its own credentials and its own store role.
components:
  application:
    source: apps/web
    credentials_ref: local:zone1-application
    store_role: sisf_application
    health_check: /healthz
  agent:
    source: factory
    credentials_ref: local:zone2-agent
    store_role: sisf_agent
    health_check: /healthz
  control:
    source: control
    credentials_ref: local:zone3-control
    store_role: sisf_control
    health_check: /healthz

# The nine runtime units. Zone and lifecycle follow from the unit name.
units:
  app:
    image: ghcr.io/acme/hello-app
    digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
    lifecycle: long_running
    networks: [app]
    port: 7461
    mounts:
      - volume: app-data
        path: /data
  control:
    image: ghcr.io/acme/sisf-factoryd
    digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
    command: [factoryd, control]
    lifecycle: long_running
    networks: [control, factory]
    port: 7463
    public: true
    public_routes: [/webhooks/github, /report]
    mounts:
      - volume: control-data
        path: /var/lib/sisf/control
  supervisor:
    image: ghcr.io/acme/sisf-supervisor
    digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
    lifecycle: long_running
    networks: [control]
    port: 7464
    mounts:
      - volume: trust
        path: /var/lib/sisf/trust
  dispatcher:
    image: ghcr.io/acme/sisf-factoryd
    digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
    command: [factoryd, dispatcher]
    lifecycle: long_running
    networks: [factory]
    port: 7465
  runner:
    image: ghcr.io/acme/sisf-runner
    digest: sha256:4444444444444444444444444444444444444444444444444444444444444444
    lifecycle: ephemeral
    networks: [sandbox]
    mounts:
      - volume: workspaces
        path: /workspace
  qa-runner:
    image: ghcr.io/acme/sisf-qa-runner
    digest: sha256:5555555555555555555555555555555555555555555555555555555555555555
    lifecycle: ephemeral
    networks: [sandbox]
    # QA runs with an identity and credentials of its own, never the runner's.
    credentials_ref: local:zone2-qa
    mounts:
      - volume: qa-workspaces
        path: /workspace
  state:
    image: postgres
    digest: sha256:6666666666666666666666666666666666666666666666666666666666666666
    lifecycle: durable
    networks: [app, factory, control]
    mounts:
      - volume: state-data
        path: /var/lib/postgresql/data
  artifacts:
    lifecycle: durable
    mounts:
      - volume: artifacts
        path: /var/lib/sisf/artifacts
  edge:
    image: ghcr.io/acme/sisf-edge
    digest: sha256:7777777777777777777777777777777777777777777777777777777777777777
    lifecycle: long_running
    networks: [app, control, sandbox]
    port: 7460
    public: true

# The trusted release supervisor. All four conditions below must hold, or the
# checker rejects the manifest: its own pinned artifact, a trust volume only
# it writes, a digest only a governance cycle changes, a startup self-check.
supervisor:
  image: ghcr.io/acme/sisf-supervisor
  digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
  trust_volume: trust
  root_key_ref: env:SISF_ROOT_PUBLIC_KEY
  digest_change: governance
  startup_self_check: true

networks:
  app: {}
  factory:
    internal: true
  control:
    internal: true
  sandbox:
    internal: true
    egress_via: edge

# Each volume names the only zone allowed to write to it. A shared volume is
# kept by one unit every zone uses (state, artifacts or edge), named by holder.
volumes:
  app-data:
    zone: application
  workspaces:
    zone: agent
  qa-workspaces:
    zone: agent
  control-data:
    zone: control
  trust:
    zone: control
  state-data:
    zone: shared
  artifacts:
    zone: shared
    holder: artifacts

storage:
  state:
    driver: postgres
    dsn_ref: env:SISF_STATE_DSN
  artifacts:
    kind: volume
    location: artifacts

adapters:
  coder:
    name: claude
  qa:
    name: codex
  execution:
    name: docker
  deploy:
    name: compose

release:
  policy: B
  strategy: canary
  canary_steps: [5, 25, 100]
  # A candidate the factory publishes by itself may change only paths its
  # unit consumes. Only app has built-in inputs: the files directly in the
  # directories of the Go packages it links, other than module and
  # workspace files (go.mod, go.sum, go.work, go.work.sum).
  # No other unit, control included, has any unless declared here. For an
  # application laid out otherwise, declare its inputs as patterns matched
  # against whole paths (* never crosses /); they replace the built-in ones
  # and may not reach a protected path:
  #   unit_inputs:
  #     app: ["*.go", "web/*.html"]
  units: [app]
  rollback:
    error_rate: 0.02
    baseline_delta: 0.01
    min_samples: 100
    window: 10m
    consecutive_windows: 2
  low_traffic:
    min_hold: 30m
    synthetic_suite: synthetic

# Unlimited means only that the factory sets no monetary cap of its own.
budget:
  mode: unlimited
  alert_threshold_micros: 50000000
  period: monthly

# These limits apply whatever the budget mode.
limits:
  run_timeout: 30m
  max_attempts: 3
  concurrency: 2
  clarify_timeout: 72h

egress:
  mode: allowlist
  allow:
    - api.anthropic.com
    - api.openai.com
    - github.com
    - api.github.com
    - "*.githubusercontent.com"
    - registry.npmjs.org
    - pypi.org
    - files.pythonhosted.org
    - crates.io
    - static.crates.io
    - proxy.golang.org
    - sum.golang.org
    - repo.maven.apache.org
    - registry-1.docker.io
    - auth.docker.io
    - ghcr.io
    - deb.debian.org
    - archive.ubuntu.com
    - dl-cdn.alpinelinux.org

# The model of each kind of step. The names are placeholders for the tiers a
# deployment configures. QA runs on another provider or model than every
# coding and planning route; a deployment with a single route states
# same_model_route: true instead.
model_routes:
  routes:
    intake:
      provider: anthropic
      model: small
      effort: low
    coding:
      provider: anthropic
      model: mid
      effort: low
    planning:
      provider: anthropic
      model: large
      effort: medium
    read_only:
      provider: anthropic
      model: small
    qa:
      provider: openai
      model: mid
      effort: low
  escalation:
    coding:
      - provider: anthropic
        model: mid
        effort: high
      - provider: anthropic
        model: large
        effort: low
  max_escalations: 2
